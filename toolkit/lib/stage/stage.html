<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No zoom: a phone stage would zoom into a focused input under 16 px. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Help stage</title>
<style>
  /* The recording stage: a calm background, the app in a window or a phone, a
     smoothed cursor, click ripples, a camera that zooms and pans, key chips,
     captions and title cards. window.stage is driven by recorder.mjs. */
  :root { --bg-1: #f3f5f8; --bg-2: #dfe3e9; --chrome: #ffffff; --chrome-border: rgba(20, 24, 31, .1);
    --window-shadow: 0 40px 90px rgba(24, 32, 46, .22), 0 10px 26px rgba(24, 32, 46, .12); --ink: #202329; --muted: #5c636e;
    --card: rgba(255, 255, 255, .94); --pill: rgba(24, 26, 30, .95); --pill-ink: #ffffff; --mark: #e5322d; }
  :root[data-theme="dark"] { --bg-1: #17191d; --bg-2: #0b0c0e; --chrome: #1b1d21; --chrome-border: rgba(255, 255, 255, .09);
    --window-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 10px 30px rgba(0, 0, 0, .35); --ink: #f2f3f5; --muted: #a2a8b1;
    --card: rgba(24, 26, 30, .92); --pill: rgba(244, 245, 247, .97); --pill-ink: #111214; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-2); font-family: var(--font, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
  #scene { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 38%, var(--bg-1) 0%, var(--bg-2) 72%); overflow: hidden; }
  #camera { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .window { position: absolute; border-radius: 14px; overflow: hidden; background: var(--chrome); box-shadow: var(--window-shadow); outline: 1px solid var(--chrome-border); }
  .titlebar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--chrome); border-bottom: 1px solid var(--chrome-border); position: relative; }
  .titlebar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .titlebar i:nth-child(1) { background: #ff5f57; } .titlebar i:nth-child(2) { background: #febc2e; } .titlebar i:nth-child(3) { background: #28c840; }
  .titlebar span { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: -.01em; }
  .titlebar span img { width: 15px; height: 15px; }
  iframe { display: block; border: 0; background: transparent; }
  .phone { position: absolute; border-radius: 68px; background: #0b0b0c; padding: 14px; box-shadow: var(--window-shadow), inset 0 0 0 2px #2c2d31, inset 0 0 0 4px #0b0b0c; }
  .phone .screen { position: relative; border-radius: 54px; overflow: hidden; background: var(--app-top, #ffffff); }
  .phone .status { height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 38px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: var(--status-ink, #111214); background: var(--app-top, #ffffff); position: relative; }
  .phone .status .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; }
  .phone .status svg { display: block; }
  .phone .status .icons { display: flex; gap: 6px; align-items: center; }
  .phone .home { height: 34px; background: var(--app-bottom, #ffffff); position: relative; }
  .phone .home::after { content: ""; position: absolute; left: 50%; bottom: 9px; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: var(--status-ink, #111214); opacity: .85; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  #cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; transform-origin: 3px 3px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); transition: opacity .25s; z-index: 2; }
  #touch { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(32, 35, 41, .18); box-shadow: 0 0 0 1.5px rgba(32, 35, 41, .45), 0 6px 18px rgba(0, 0, 0, .12); opacity: 0; transition: opacity .18s, transform .18s; z-index: 2; }
  :root[data-theme="dark"] #touch { background: rgba(255, 255, 255, .32); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .65), 0 6px 18px rgba(0, 0, 0, .25); }
  .ripple { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--mark); animation: ripple .55s cubic-bezier(.2, .7, .3, 1) forwards; z-index: 2; }
  @keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  #keys { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; gap: 8px; opacity: 0; transition: opacity .2s; }
  #keys.on { opacity: 1; }
  #keys kbd { min-width: 46px; height: 46px; padding: 0 14px; display: grid; place-items: center; border-radius: 11px; background: var(--card); color: var(--ink); font: 600 20px/1 inherit; box-shadow: 0 10px 30px rgba(0, 0, 0, .3), inset 0 0 0 1px var(--chrome-border); }
  /* The caption: the step number and the instruction, the name of the button
     or field in the color of the marks. */
  #caption { position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 10px); max-width: 86%; padding: 14px 26px; border-radius: 999px; background: var(--pill); color: var(--pill-ink); font-size: 27px; font-weight: 500; letter-spacing: -.015em; line-height: 1.25; text-align: center; text-wrap: balance; box-shadow: 0 12px 40px rgba(0, 0, 0, .28), inset 0 0 0 1px var(--chrome-border); opacity: 0; transition: opacity .35s, transform .35s; }
  #caption.on { opacity: 1; transform: translate(-50%, 0); }
  #caption b { color: var(--mark); font-weight: 600; }
  #caption .step { color: var(--mark); font-weight: 700; margin-right: 10px; }
  :root[data-device="phone"] #caption { bottom: 64px; font-size: 38px; max-width: 88%; padding: 18px 26px; border-radius: 18px; }
  #card { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; background: radial-gradient(120% 90% at 50% 40%, var(--bg-1) 0%, var(--bg-2) 75%); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .5s; padding: 0 80px; }
  #card.on { opacity: 1; }
  #card-brand { display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
  #card-brand[hidden] { display: none; }
  #card-brand img { height: 54px; }
  #card-brand img.is-symbol { height: 50px; border-radius: 12px; }
  #card h1 { margin: 6px 0 0; font-size: 60px; font-weight: 600; letter-spacing: -.035em; line-height: 1.05; max-width: 1200px; text-wrap: balance; }
  #card p { margin: 0; font-size: 28px; color: var(--muted); letter-spacing: -.01em; max-width: 1000px; text-wrap: balance; }
  :root[data-device="phone"] #card h1 { font-size: 72px; max-width: 900px; }
  :root[data-device="phone"] #card p { font-size: 36px; max-width: 860px; }
  :root[data-device="phone"] #card-brand { font-size: 46px; }
  :root[data-device="phone"] #card-brand img { height: 70px; }
</style>
<script src="config.js"></script>
</head>
<body>
<div id="scene">
  <div id="camera"><div id="frame"></div></div>
  <div id="keys"></div>
  <div id="caption"></div>
  <div id="card"><div id="card-brand" hidden><img alt="" id="card-logo"><span id="card-name"></span></div><h1 id="card-title"></h1><p id="card-subtitle"></p></div>
</div>
<script src="stage.js"></script>
</body>
</html>
